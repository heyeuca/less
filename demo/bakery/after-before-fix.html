<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oven Door bakery at 214 Elm Street. Fresh sourdough, pastries, baguettes, and seasonal fruit tarts, Tuesday through Sunday.">
  <title>Oven Door — Neighborhood Bakery</title>
  <style>
    :root {
      --ink: #202219;
      --paper: #f4eddd;
      --red: #c83b24;
      --yellow: #efc15d;
      --line: rgba(32, 34, 25, .22);
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .skip-link {
      position: fixed; left: 1rem; top: -5rem; z-index: 99;
      background: var(--ink); color: white; padding: .8rem 1rem;
    }
    .skip-link:focus { top: 1rem; }

    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 36px;
      padding: .45rem 1rem;
      background: var(--ink);
      color: var(--paper);
      font-size: .71rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }
    header {
      position: relative;
      z-index: 20;
      border-bottom: 1px solid var(--line);
    }
    nav {
      height: 82px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1400px;
      margin: auto;
      padding: 0 4vw;
    }
    .nav-links, .nav-actions { display: flex; align-items: center; gap: clamp(1rem, 2.6vw, 2.5rem); }
    .nav-actions { justify-content: flex-end; }
    .nav-link {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      position: relative;
    }
    .nav-link::after {
      content: ""; position: absolute; left: 0; right: 100%; bottom: -6px;
      height: 2px; background: var(--red); transition: right .25s ease;
    }
    .nav-link:hover::after, .nav-link:focus-visible::after { right: 0; }
    .logo {
      font-family: var(--serif);
      font-size: clamp(1.45rem, 2.2vw, 2.15rem);
      font-weight: 700;
      line-height: .82;
      text-align: center;
    }
    .logo small {
      display: block; margin-top: .38rem; font-family: var(--sans);
      font-size: .42em; letter-spacing: .28em; text-transform: uppercase;
    }
    .phone-pill {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: .65rem 1rem;
      transition: background .2s, color .2s;
    }
    .phone-pill:hover { color: var(--paper); background: var(--ink); }
    .menu-toggle { display: none; background: none; border: 0; padding: .5rem; cursor: pointer; }
    .menu-toggle span { display: block; width: 26px; height: 2px; background: var(--ink); margin: 5px; }

    .hero { border-bottom: 1px solid var(--line); }
    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: min(620px, calc(100vh - 118px));
      padding: 7vw;
    }
    h1 {
      max-width: 900px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(4.8rem, 10.4vw, 10rem);
      font-weight: 400;
      letter-spacing: -.07em;
      line-height: .75;
    }

    section { scroll-margin-top: 20px; }
    .menu-section { padding: clamp(5rem, 10vw, 9rem) 6vw; }
    .section-heading { max-width: 1250px; margin: 0 auto 4rem; }
    h2 {
      margin: -.18em 0 0;
      font-family: var(--serif); font-size: clamp(3.2rem, 7vw, 7rem); font-weight: 400; letter-spacing: -.055em; line-height: .92;
    }
    .menu-list { max-width: 1250px; margin: auto; border-top: 2px solid var(--ink); }
    .menu-item {
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 1.5rem;
      padding: clamp(1.3rem, 2.4vw, 2rem) .5rem;
      border-bottom: 1px solid var(--ink);
    }
    .item-name { font-family: var(--serif); font-size: clamp(1.8rem, 3.2vw, 3rem); letter-spacing: -.03em; }
    .item-detail { font-family: var(--sans); font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-left: 1rem; }
    .item-price { font-family: var(--serif); font-size: clamp(1.5rem, 2.5vw, 2.3rem); }
    .seasonal { display: inline-block; color: var(--red); }

    .visit {
      padding: clamp(5rem, 10vw, 9rem) 6vw;
      background: var(--yellow);
    }
    .visit-grid { max-width: 1250px; margin: auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 8vw; }
    .visit h2 { max-width: 640px; }
    .address { margin: 2rem 0; font-family: var(--serif); font-size: clamp(1.5rem, 2.6vw, 2.4rem); line-height: 1.35; }
    .underlined { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
    .hours-card { border: 2px solid var(--ink); padding: 2rem; background: rgba(244,237,221,.45); }
    .hours-card h3 { margin: 0 0 1.4rem; font-family: var(--serif); font-size: 2.1rem; }
    .hours-row { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--ink); font-size: .9rem; font-weight: 700; }
    .closed { color: var(--red); }

    @media (max-width: 800px) {
      nav { grid-template-columns: auto 1fr auto; height: 70px; }
      .logo { grid-column: 1; text-align: left; }
      .nav-links {
        position: absolute; top: 106px; left: 0; right: 0; background: var(--paper);
        flex-direction: column; align-items: stretch; padding: 1rem 6vw 2rem; border-bottom: 1px solid var(--ink);
        opacity: 0; transform: translateY(-12px); pointer-events: none; transition: .25s;
      }
      .nav-links.open { opacity: 1; transform: none; pointer-events: auto; }
      .nav-link { padding: .9rem 0; border-bottom: 1px solid var(--line); }
      .nav-actions .nav-link { display: none; }
      .menu-toggle { display: block; grid-column: 3; }
      .nav-actions { grid-column: 2; padding-right: .5rem; }
      .hero-copy { padding: 5rem 6vw; }
      h1 { font-size: clamp(4.4rem, 22vw, 8rem); }
      .visit-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .menu-section { padding-left: 5vw; padding-right: 5vw; }
      .item-name { font-size: 1.55rem; }
      .item-price { font-size: 1.35rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="topbar">Tuesday–Sunday · 7am–3pm</div>
  <header>
    <nav aria-label="Main navigation">
      <div class="nav-links" id="navLinks">
        <a class="nav-link" href="#menu">Menu</a>
        <a class="nav-link" href="#visit">Visit</a>
      </div>
      <a class="logo" href="#" aria-label="Oven Door home">Oven Door<small>Bakery</small></a>
      <div class="nav-actions">
        <a class="nav-link phone-pill" href="tel:+15550142290">(555) 014-2290</a>
      </div>
      <button class="menu-toggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">
        <span></span><span></span>
      </button>
    </nav>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero-copy">
        <h1>Oven Door</h1>
      </div>
    </section>

    <section class="menu-section" id="menu">
      <div class="section-heading">
        <h2>Menu</h2>
      </div>
      <div class="menu-list">
        <div class="menu-item"><div class="item-name">Sourdough Loaf</div><span class="item-price">$9</span></div>
        <div class="menu-item"><div class="item-name">Croissant</div><span class="item-price">$4</span></div>
        <div class="menu-item"><div class="item-name">Cinnamon Roll</div><span class="item-price">$5</span></div>
        <div class="menu-item"><div class="item-name">Baguette</div><span class="item-price">$4</span></div>
        <div class="menu-item"><div class="item-name">Fruit Tart <span class="item-detail seasonal">Seasonal</span></div><span class="item-price">$6</span></div>
      </div>
    </section>

    <section class="visit" id="visit">
      <div class="visit-grid">
        <div>
          <h2>Visit</h2>
          <p class="address">214 Elm Street<br><a class="underlined" href="tel:+15550142290">(555) 014-2290</a></p>
        </div>
        <div class="hours-card">
          <h3>Bakery hours</h3>
          <div class="hours-row"><span>Tuesday–Sunday</span><span>7am–3pm</span></div>
          <div class="hours-row closed"><span>Monday</span><span>Closed</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', open);
    });
    navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }));
  </script>
</body>
</html>
